name: Apply D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: 보호된 원격 D1 마이그레이션
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        shell: bash
        run: |
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/wrangler-d1.json", JSON.stringify({name:"synth-coach-migrations",compatibility_date:"2026-09-08",d1_databases:[{binding:"DB",database_name:process.env.D1_DATABASE_NAME,database_id:process.env.D1_DATABASE_ID,migrations_dir:"drizzle"}]}))'
          npx wrangler d1 migrations apply DB --remote --config "$RUNNER_TEMP/wrangler-d1.json"
